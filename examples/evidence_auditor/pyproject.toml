[project]
name = "evidence-auditor"
version = "0.1.0"
description = "Demo offline de auditoría de evidencia para Juntos y ENAHO"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.19.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
evidence-auditor = "evidence_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
