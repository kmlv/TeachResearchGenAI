project:
  type: website
  output-dir: _site
  execute-dir: project
  # Explicit allow-list. Nothing renders unless it is named here, so coord/,
  # inputs/, deliverables/ and internal drafts cannot be published by accident.
  render:
    - index.qmd
    - course/slides/ia-generativa-investigacion-ciencias-sociales.qmd
    - course/slides/literatura-agentes-integrados.qmd
    - course/slides/analisis-datos-codex-jupyter.qmd
    - course/slides/lean-verificacion-matematica.qmd
    - course/slides/bonus-embeddings-rag.qmd
  # Explicit deny-list for copied resources. Quarto copies non-source files
  # from the project directory into the output tree; these directories must
  # never travel with the site.
  resources:
    - "!coord/**"
    - "!inputs/**"
    - "!deliverables/**"
    - "!.git/**"
    - "!.github/**"
    - "!.quarto/**"
    - "!**/.lake/**"
    - "!**/.venv/**"
    # Local build artefacts of the embeddings bonus. `ocr_cache/` holds text
    # recognised from books the course does not redistribute, and the index is
    # tens of megabytes; neither may travel with the site.
    - "!**/local_index*/**"
    - "!**/ocr_cache/**"
    - "!**/model_cache/**"
    # Scratch directories of exercises in progress.
    - "!**/tmp/**"
    # The lab behind section 2. The deck links to it with a relative path.
    - "course/exercises/literature_agent_lab/**"

website:
  title: "IA generativa para la investigación"
  description: "Taller de cuatro horas sobre IA generativa aplicada a la investigación económica y social."
  site-url: https://kmlv.github.io/TeachResearchGenAI
  repo-url: https://github.com/kmlv/TeachResearchGenAI
  navbar:
    background: light
    pinned: true
    right:
      - icon: github
        href: https://github.com/kmlv/TeachResearchGenAI
  page-footer:
    left: "© 2026 Kristian Lopez Vargas"
    right: "Hecho con [Quarto](https://quarto.org)"

lang: es

format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    toc: true
    toc-location: right
    toc-title: "En esta página"
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    fig-cap-location: bottom
    html-math-method: katex
    back-to-top-navigation: true
    page-layout: article
    mainfont: "Inter"
    monofont: "JetBrains Mono"
    linkcolor: "#0c2a4a"
    highlight-style: github
    grid:
      sidebar-width: 0px
      body-width: 820px
      margin-width: 230px
      gutter-width: 1.4em
